# ros_gz_bridge topic map between Gazebo and ROS 2.
# ROS 2 nodes in ros2/src talk to the simulated robot through these topics.

- ros_topic_name: "clock"
  gz_topic_name: "clock"
  ros_type_name: "rosgraph_msgs/msg/Clock"
  gz_type_name: "gz.msgs.Clock"
  direction: GZ_TO_ROS

# Drive command in. linear.x = m/s forward, angular.z = rad/s.
- ros_topic_name: "cmd_vel"
  gz_topic_name: "cmd_vel"
  ros_type_name: "geometry_msgs/msg/Twist"
  gz_type_name: "gz.msgs.Twist"
  direction: ROS_TO_GZ

- ros_topic_name: "odom"
  gz_topic_name: "odom"
  ros_type_name: "nav_msgs/msg/Odometry"
  gz_type_name: "gz.msgs.Odometry"
  direction: GZ_TO_ROS

# odom -> base_link transform from the diff drive plugin.
- ros_topic_name: "tf"
  gz_topic_name: "tf"
  ros_type_name: "tf2_msgs/msg/TFMessage"
  gz_type_name: "gz.msgs.Pose_V"
  direction: GZ_TO_ROS

- ros_topic_name: "joint_states"
  gz_topic_name: "joint_states"
  ros_type_name: "sensor_msgs/msg/JointState"
  gz_type_name: "gz.msgs.Model"
  direction: GZ_TO_ROS

# OAK-D Lite color camera (69 deg HFOV). ROS name kept as camera/image_raw
# so the existing viewer node works.
- ros_topic_name: "camera/image_raw"
  gz_topic_name: "camera/image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

- ros_topic_name: "camera/camera_info"
  gz_topic_name: "camera/camera_info"
  ros_type_name: "sensor_msgs/msg/CameraInfo"
  gz_type_name: "gz.msgs.CameraInfo"
  direction: GZ_TO_ROS

# OAK-D Lite stereo depth, aligned to the color image (same size and
# camera_info). 32FC1, meters. Pixels under 0.20 m (min depth) or past 12 m
# have no depth.
- ros_topic_name: "camera/depth_image"
  gz_topic_name: "camera/depth_image"
  ros_type_name: "sensor_msgs/msg/Image"
  gz_type_name: "gz.msgs.Image"
  direction: GZ_TO_ROS

# Point cloud from the stereo depth.
- ros_topic_name: "camera/points"
  gz_topic_name: "camera/points"
  ros_type_name: "sensor_msgs/msg/PointCloud2"
  gz_type_name: "gz.msgs.PointCloudPacked"
  direction: GZ_TO_ROS

# OAK-D Lite IMU (BMI270), 200 Hz, frame imu_link. Raw accel + gyro only:
# orientation is not filled in, like the real chip.
- ros_topic_name: "camera/imu"
  gz_topic_name: "camera/imu"
  ros_type_name: "sensor_msgs/msg/Imu"
  gz_type_name: "gz.msgs.IMU"
  direction: GZ_TO_ROS

# ----- Field (simulation/scripts/field_manager.py) -----

# Ground truth for the current layout, JSON, 1 Hz: assigned pit / start tag
# ID, die roll, obstacle names, quadrants, lanes and poses. For testing and
# scoring only; the robot must not read this during a real run.
- ros_topic_name: "field/layout"
  gz_topic_name: "/field/layout"
  ros_type_name: "std_msgs/msg/String"
  gz_type_name: "gz.msgs.StringMsg"
  direction: GZ_TO_ROS

# New random layout. data = seed, < 0 = random seed.
- ros_topic_name: "field/randomize"
  gz_topic_name: "/field/randomize"
  ros_type_name: "std_msgs/msg/Int32"
  gz_type_name: "gz.msgs.Int32"
  direction: ROS_TO_GZ

# Start flag. true = raise (race start), false = lower.
- ros_topic_name: "field/start_flag"
  gz_topic_name: "/field/start_flag"
  ros_type_name: "std_msgs/msg/Bool"
  gz_type_name: "gz.msgs.Boolean"
  direction: ROS_TO_GZ
